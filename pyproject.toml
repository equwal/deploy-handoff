# handoff.py uses only the Python standard library.
# The group below holds the tools that check it. README.md tells how to run them.

[dependency-groups]
dev = ["hypothesis", "mypy", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["handoff"]

[tool.mypy]
strict = true
