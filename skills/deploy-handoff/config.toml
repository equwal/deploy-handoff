# The hosts that handoff.py can open. An entry also allows its subdomains.
# Do not edit this file to add hosts, because an update replaces it.
# Put your hosts in allowed_hosts in ~/.config/deploy-handoff/config.toml.
allowed_hosts = [
  # Code and pull requests
  "github.com",
  "gitlab.com",
  # Payments
  "stripe.com",
  # Android and iOS stores
  "play.google.com",
  "payments.google.com",
  "f-droid.org",
  "appstoreconnect.apple.com",
  "developer.apple.com",
  # Sign-in and cloud consoles
  "accounts.google.com",
  "console.cloud.google.com",
  # Hosting
  "vercel.com",
  "app.netlify.com",
  "dash.cloudflare.com",
  "fly.io",
]
